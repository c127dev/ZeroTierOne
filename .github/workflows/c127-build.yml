name: c127-build

# The file name must not collide with a workflow on the source branch. GitHub
# keys a workflow by its path across every ref, so sharing a name with
# upstream's build.yml would make disabling that one disable this one too.
#
# mikrozt1 carries source only, so nothing there triggers this. Builds start
# from a dispatch: the Actions tab with this branch selected, or a fine-grained
# token holding Actions read and write:
# POST /repos/{owner}/{repo}/actions/workflows/c127-build.yml/dispatches {"ref":"compiler"}
#
# The push trigger exists so GitHub keeps this workflow registered. It only
# indexes a dispatchable workflow it has seen on the default branch or seen
# run, and the source branch holds no workflow file for it. Every job is gated
# on the event, so a push to this branch registers the workflow and builds
# nothing.
on:
  workflow_dispatch:
  push:
    branches: [compiler]

permissions:
  contents: write
  packages: write

env:
  SOURCE_BRANCH: mikrozt1
  DOCKERHUB_IMAGE: docker.io/c127/zerotierone

jobs:
  plan:
    # A push to this branch registers the workflow and stops here. Every other
    # job needs plan, so they all skip with it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
      last: ${{ steps.plan.outputs.last }}
      sha: ${{ steps.plan.outputs.sha }}
      image: ${{ steps.plan.outputs.image }}
      boards: ${{ steps.plan.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Resolve the version from version.h and the run number
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Resolved once here: every job checks out the source branch, and a
          # dispatch on the compiler branch makes GITHUB_SHA point at this tree.
          sha=$(git rev-parse HEAD)

          # Matched on the macro being defined, not on the name appearing in
          # the line: ZEROTIER_ONE_VERSION_STR mentions all three, and a
          # substring match takes _ZT_STR(...) from it as the version.
          upstream=$(awk '
            $1=="#define" && $2=="ZEROTIER_ONE_VERSION_MAJOR"    { major=$3 }
            $1=="#define" && $2=="ZEROTIER_ONE_VERSION_MINOR"    { minor=$3 }
            $1=="#define" && $2=="ZEROTIER_ONE_VERSION_REVISION" { rev=$3 }
            END {
              if (major ~ /^[0-9]+$/ && minor ~ /^[0-9]+$/ && rev ~ /^[0-9]+$/)
                print major "." minor "." rev
            }
          ' version.h)
          if [ -z "$upstream" ]; then
            echo "could not read a version from version.h" >&2
            exit 1
          fi

          # The run number is what separates two builds of one upstream
          # version. It is unique per workflow file and only ever rises, so no
          # release gate and no tag collision.
          version="$upstream.$GITHUB_RUN_NUMBER"

          last=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "title=ZeroTier One $version"
            echo "last=$last"
            echo "sha=$sha"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

          # A board file asks for a tuned image by setting ZT_VARIANT.
          boards=$(
            for f in boards/*.conf; do
              [ -f "$f" ] || continue
              variant=$(sed -n 's/^ZT_VARIANT=//p' "$f" | tr -d '"')
              platform=$(sed -n 's/^ZT_PLATFORM=//p' "$f" | tr -d '"')
              [ -n "$variant" ] && [ -n "$platform" ] || continue
              tune=$(sed -n 's/^ZT_TUNE=//p' "$f" | tr -d '"')
              mk=$(sed -n 's/^ZT_MAKE=//p' "$f" | tr -d '"')
              jq -cn --arg v "$variant" --arg p "$platform" --arg t "$tune" --arg m "$mk" \
                '{variant:$v, platform:$p, tune:$t, make:$m}'
            done | jq -sc .
          )
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

          echo "$version from version.h $upstream, run $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "board images: $boards" >> "$GITHUB_STEP_SUMMARY"

  # One job per architecture, each on the runner that builds it natively where
  # one exists. arm64 sets ZT_SSO_SUPPORTED=1 in make-linux.mk, so it compiles
  # zeroidc with cargo; under qemu that alone took longer than every other job
  # combined. armv7 and riscv64 have no native runner, but they also build no
  # rust, so emulation stays tolerable.
  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-latest
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-latest
    steps:
      - name: Check out the source that plan resolved
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Check out the container recipe
        uses: actions/checkout@v4
        with:
          ref: compiler
          path: .compiler

      - uses: docker/setup-qemu-action@v3
      # The default buildx driver is docker, which cannot export a cache.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed without a tag: the manifest job names it. A tag here would have
      # four jobs overwrite each other's single-architecture image.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .compiler/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      # Same build, from cache, written to a file for offline installs.
      - name: Save the ${{ matrix.arch }} tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .compiler/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: zerotier-one:${{ matrix.arch }}
          outputs: type=docker,dest=zerotier-one-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Compress
        run: gzip -9 "zerotier-one-${{ matrix.arch }}.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: zerotier-one-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Joins the four digests into one multi-architecture tag, then copies that
  # index to Docker Hub. imagetools moves the existing manifests, so nothing is
  # rebuilt and the two registries carry identical digests.
  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GHCR tags
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          cd digests
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${SHA:0:7}" \
            $(printf "$IMAGE@sha256:%s " *)

      # secrets are not available in a job-level if, so the gate is a step that
      # reports whether the login happened. A fork without the secrets still
      # publishes to GHCR.
      - name: Docker Hub login
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_TOKEN:-}" ] || [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN unset, GHCR only"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Copy the index to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$DOCKERHUB_IMAGE:$VERSION" \
            -t "$DOCKERHUB_IMAGE:latest" \
            "$IMAGE:$VERSION"

      - name: Summary
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          HUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Hub: $HUB" >> "$GITHUB_STEP_SUMMARY"

  # Per-board images. A board declares itself by setting ZT_VARIANT in
  # boards/*.conf on the source branch; no edit here is needed to add one.
  variant:
    needs: plan
    if: needs.plan.outputs.boards != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    steps:
      - name: Check out the source that plan resolved
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Check out the container recipe
        uses: actions/checkout@v4
        with:
          ref: compiler
          path: .compiler

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.board.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .compiler/Dockerfile
          platforms: ${{ matrix.board.platform }}
          build-args: |
            ZT_TUNE=${{ matrix.board.tune }}
            ZT_MAKE=${{ matrix.board.make }}
          push: true
          tags: |
            ${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.version }}-${{ matrix.board.variant }}
            ${{ needs.plan.outputs.image }}:${{ matrix.board.variant }}
          cache-from: type=gha,scope=${{ matrix.board.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.board.variant }}

      # Same build, from cache, written to a file for offline installs.
      - name: Save the ${{ matrix.board.variant }} tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .compiler/Dockerfile
          platforms: ${{ matrix.board.platform }}
          build-args: |
            ZT_TUNE=${{ matrix.board.tune }}
            ZT_MAKE=${{ matrix.board.make }}
          tags: zerotier-one:${{ matrix.board.variant }}
          outputs: type=docker,dest=zerotier-one-${{ matrix.board.variant }}-tuned.tar
          cache-from: type=gha,scope=${{ matrix.board.variant }}

      - name: Compress
        run: gzip -9 "zerotier-one-${{ matrix.board.variant }}-tuned.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-board-${{ matrix.board.variant }}
          path: zerotier-one-${{ matrix.board.variant }}-tuned.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [plan, build, manifest, variant]
    # variant is skipped when no board declares one, which must not skip the
    # release with it.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.manifest.result == 'success'
      && (needs.variant.result == 'success' || needs.variant.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source that plan resolved
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: Write notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          LAST: ${{ needs.plan.outputs.last }}
          VERSION: ${{ needs.plan.outputs.version }}
          IMAGE: ${{ needs.plan.outputs.image }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail

          range=""
          if [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
            range="$LAST..HEAD"
          fi

          {
            echo "ZeroTier One $VERSION, built from $SOURCE_BRANCH at ${SHA:0:7}."
            echo
            echo '```'
            echo "podman pull $IMAGE:$VERSION"
            echo "podman pull $DOCKERHUB_IMAGE:$VERSION"
            echo '```'
            echo
            echo "Architectures: amd64, arm64, armv7, riscv64. The attached tarballs are"
            echo "for offline installs: gunzip, then /container/add file=."
            echo

            if [ -n "$range" ]; then
              echo "## Commits since $LAST"
              echo
              git log --no-merges --pretty='- %s (%h)' "$range"
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$LAST...$TAG"
            else
              echo "## Commits"
              echo
              git log --no-merges --pretty='- %s (%h)' -20
            fi
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TITLE" \
            --notes-file notes.md \
            --latest \
            zerotier-one-*.tar.gz
