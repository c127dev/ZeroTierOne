# Generic 64-bit RISC-V (RV64GC)
# No AES engine in the base ISA and no assembly Salsa20/12 for this target, so
# the crypto is the portable C++ throughout. make-linux.mk needs no per-SoC
# flags here.

ZT_TUNE=""
ZT_MAKE=""

# Image variant. ZT_PLATFORM is the target this board builds for.
# ZT_VARIANT names a tuned image, published as ghcr.io/<repo>:<variant>;
# leave it empty when the stock image already covers the board.
ZT_PLATFORM="linux/riscv64"
ZT_VARIANT=""
