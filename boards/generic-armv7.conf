# Generic 32-bit ARM (ARMv7-A)
# NEON is optional in ARMv7-A, so the generic build leaves ZT_ARM_NEON off and
# relies on the runtime zt_arm_has_neon() check that gates the NEON assembly
# Salsa20/12. Copy this file and set ZT_ARM_NEON=1 once the SoC is known.

ZT_TUNE=""
ZT_MAKE=""

# Image variant. ZT_PLATFORM is the target this board builds for.
# ZT_VARIANT names a tuned image, published as ghcr.io/<repo>:<variant>;
# leave it empty when the stock image already covers the board.
ZT_PLATFORM="linux/arm/v7"
ZT_VARIANT=""
