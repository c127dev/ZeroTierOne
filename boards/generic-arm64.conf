# Generic 64-bit ARM (ARMv8-A)
# make-linux.mk already builds arm64 with -march=armv8-a+crypto, so the AES
# paths are on and no extra tuning applies to the whole architecture.

ZT_TUNE=""
ZT_MAKE=""

# Image variant. ZT_PLATFORM is the target this board builds for.
# ZT_VARIANT names a tuned image, published as ghcr.io/<repo>:<variant>;
# leave it empty when the stock image already covers the board.
ZT_PLATFORM="linux/arm64"
ZT_VARIANT=""
