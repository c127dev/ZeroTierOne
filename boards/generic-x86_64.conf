# Generic x86-64
# The Makefile already turns on the amd64 Salsa20/12 and ed25519 assembly and
# builds AES-NI paths, so there is nothing left to tune per SoC here.

ZT_TUNE=""
ZT_MAKE=""

# Image variant. ZT_PLATFORM is the target this board builds for.
# ZT_VARIANT names a tuned image, published as ghcr.io/<repo>:<variant>;
# leave it empty when the stock image already covers the board.
ZT_PLATFORM="linux/amd64"
ZT_VARIANT=""
