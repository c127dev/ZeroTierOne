# MikroTik RB4011iGS+
# SoC   : Annapurna Labs AL21400, 4x Cortex-A15 @ 1.4 GHz
# ISA   : ARMv7-A, NEON + VFPv4, no ARMv8 crypto extensions
# Host  : RouterOS v7 container
#
# Reference board: the optimizations on this branch are measured here.
#
# No AES engine on Cortex-A15, so AES-GMAC-SIV runs in software and costs more
# than Salsa20/12 + Poly1305. Put the peers this router talks to in
# settings.forceSalsaPeers in local.conf to keep them on the Salsa path.

ZT_TUNE="-mcpu=cortex-a15 -mfpu=neon-vfpv4 -mfloat-abi=hard"

# No ZT_ARM_NEON here. It appends -march=armv7-a -mfpu=neon, which lands after
# the flags above and wins, dropping the binary from VFPv4 to VFPv3 and losing
# fused multiply-add. The tune flags already give the compiler NEON, and the
# assembly Salsa20/12 is gated on the toolchain triple, not on this flag.
ZT_MAKE=""

# Image variant. ZT_PLATFORM is the target this board builds for.
# ZT_VARIANT names a tuned image, published as ghcr.io/<repo>:<variant>;
# leave it empty when the stock image already covers the board.
ZT_PLATFORM="linux/arm/v7"
ZT_VARIANT="rb4011igs"
